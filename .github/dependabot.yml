version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      tooling:
        patterns:
          - firebase-tools
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    groups:
      firebase:
        patterns:
          - firebase-*
      development:
        dependency-type: development
    ignore:
      # firebase-functions 7.x declares a peer dependency on firebase-admin
      # ^11 || ^12 || ^13, so the admin 14 major cannot install under npm ci.
      # Remove this once firebase-functions accepts firebase-admin 14.
      - dependency-name: firebase-admin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
