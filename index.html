<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Set theme before CSS loads to prevent white flash
    (function() {
      var theme = localStorage.getItem("theme");
      if (!theme) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Lightmap</title>
  <script src="https://d3js.org/d3.v7.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hamburger menu -->
  <button class="hamburger" id="hamburgerMenu" aria-label="Open menu" tabindex="0">
    <svg class="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="menu-dropdown" id="menuDropdown" role="menu" aria-label="Main menu">
    <button class="menu-item" id="aboutMenu" role="menuitem" tabindex="-1" aria-label="About">About</button>
    <button class="menu-item" id="privacyMenu" role="menuitem" tabindex="-1" aria-label="Privacy">Privacy</button>
  </div>
  <div class="buttons">
    <button id="msg-0" style="background-color: #e6194b; color: white;" aria-label="Send 'I love you' message">I love you</button>
    <button id="msg-1" style="background-color: #3cb44b; color: white;" aria-label="Send 'Thank you' message">Thank you</button>
    <button id="msg-2" style="background-color: #4363d8; color: white;" aria-label="Send 'I forgive you' message">I forgive you</button>
    <button id="msg-3" style="background-color: #911eb4; color: white;" aria-label="Send 'Please forgive me' message">Please forgive me</button>
  </div>
  <button id="toggleTheme" aria-label="Toggle dark/light mode"></button>
  <svg id="map"></svg>
  <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <p id="modalMessage"></p>
      <button id="modalClose">OK</button>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js" defer></script>
  <script src="config.js"></script>
  <script src="main.js" defer></script>
</body>
</html>
